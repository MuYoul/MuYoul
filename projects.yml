# 프로필 README의 프로젝트 목록 원본.
# 이 파일만 고치면 GitHub Actions가 README의 프로젝트 영역을 다시 만든다.
#
# status: live(운영 중) | dev(개발 중) | ended(종료)
# repos:  최근 갱신일을 읽어 올 저장소(여러 개면 가장 최근 값). 없으면 updated 값을 쓴다.
# why:    해결하려던 문제 한 줄 / role: 내가 한 일과 AI가 한 일 (상세 맨 위에 표시, 없으면 생략)
#
# 공개 완료 기준: link(웹·스토어) + 화면 1~2장 + summary + why + role 이 모두 있으면 live 로 올린다.
# 갱신: GH_TOKEN=$(gh auth token) python3 scripts/build_readme.py

# README 맨 위 요약표. proof 의 {total} {live} {store_games} 는 아래 projects 에서 자동 계산.
highlights:
  - value: 끝까지 내놓고 운영한다
    proof: "{total}개 중 운영 중 {live} · 스토어 출시 게임 {store_games}"
    see: "[프로젝트](#프로젝트)"
  - value: 반복을 시스템으로 바꾼다
    proof: 게임 공통 킷·검증 도구 · OpenAPI→MCP 도구 자동 생성 · 커밋 고정 배포·롤백
    see: "[만드는 방식](#만드는-방식)"
  - value: AI에게 맡기되 판단은 내가 한다
    proof: 목표·요구사항·검증은 제가, 코드는 주로 AI가 · 품질이 안 나온 AiMER는 직접 종료
    see: "[AI와 일하는 방식](#ai와-일하는-방식)"
  - value: 운영까지 책임진다
    proof: 모든 서비스 지표를 중앙 Prometheus·Grafana로 수집 · 이전 직장에서 EKS 12개 관측성 전환
    see: "[이전 경력](#이전-경력)"

